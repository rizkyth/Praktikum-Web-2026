<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio Tracker - Modul 4</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: var(--muted);
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.875rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Filter Group */
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-filter {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .btn-filter.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Project Cards */
        .project-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .project-card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .project-title {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary);
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 999px;
            font-weight: 600;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef9c3; color: #854d0e; }

        .project-info {
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 15px;
        }

        .project-budget {
            font-weight: 700;
            color: var(--text);
            margin-top: 5px;
        }

        @media (max-width: 640px) {
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Portfolio Tracker</h1>
        <nav>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Reports</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Task 1: Project Form -->
        <form id="project-form" style="margin-bottom:20px;padding:15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end;">
              <div>
                <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px;">Judul Proyek</label>
                <input type="text" id="title" required placeholder="Contoh: Sistem Inventory" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
              <div>
                <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px;">Kategori</label>
                <select id="category" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;">
                  <option value="Web App">Web App</option>
                  <option value="Mobile App">Mobile App</option>
                  <option value="Desktop App">Desktop App</option>
                  <option value="UI/UX Design">UI/UX Design</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px;">Estimasi Anggaran (Rp)</label>
                <input type="number" id="budget" required min="1" step="100000" placeholder="2500000" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;">
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="completed" style="width:18px;height:18px;">
                <label for="completed" style="font-size:13px;">Sudah Selesai</label>
              </div>
              <div>
                <button type="submit" class="btn-filter" style="background:#1e3a8a;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">Tambah Proyek</button>
              </div>
            </div>
        </form>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="total-projects">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="total-budget">Rp 0</p>
            </div>
            <div class="stat-card">
                <h3>Proyek Selesai</h3>
                <p id="completed-projects">0</p>
            </div>
        </div>

        <div class="filter-group">
            <button class="btn-filter active" data-category="Semua">Semua</button>
            <button class="btn-filter" data-category="Web App">Web App</button>
            <button class="btn-filter" data-category="Mobile App">Mobile App</button>
            <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
            <!-- Task 1: Search Input -->
            <input type="text" id="search-input" placeholder="Cari proyek..." style="flex:1;min-width:200px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;">
        </div>

        <div id="project-list" class="project-list">
            <!-- Projects will be rendered here -->
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
